---
# The unit tests. They had no workflow at all: 313 tests existed and none of
# them ran anywhere but a developer's machine, in a repository whose other
# workflow is named "Test GLaDOS TTS Server". That one starts the server and
# checks the port; it has never imported a test module.
#
# ubuntu-latest, not self-hosted: nothing here needs a GPU, and the single
# self-hosted runner is already contended between the image build and the
# server smoke test. Putting these on a hosted runner keeps them off that
# queue, so a red test reports in a minute instead of behind a 20-minute
# image build.
name: pytest
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dataset.txt too: tests/test_build.py and
          # tests/test_audio.py import dataset_tools, which needs scipy.
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-dataset.txt
          # --no-deps: piper-tts requires the CPU-only onnxruntime, which owns
          # the same module as onnxruntime-gpu and would replace it. It is
          # needed at all because piper_runtime.runner imports
          # piper.phonemize_espeak.
          python -m pip install --no-deps -r requirements-piper.txt

      - name: Run pytest
        run: python -m pytest tests/ -q
