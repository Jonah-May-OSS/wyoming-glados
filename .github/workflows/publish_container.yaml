# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker Images
permissions:
  contents: read
  pull-requests: write

on:
  release:
    types: [published]

jobs:
   build_and_push_images:
    name: Build and Push Docker Images
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      # GPU driver (nvidia runtime) and Docker (dind sidecar) come from the
      # self-hosted ARC runner; building the image doesn't need host CUDA/nvcc.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@f4e8deed0c3c26542279f4042c0e1d059cbf012d
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3
        with:
          # Route image pulls through the lab's pull-through registry caches.
          # LAN-only mirrors; buildkit falls back to the upstream registry if
          # a mirror is unreachable (e.g. on a GitHub-hosted runner).
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["192.168.7.45:5000"]
            [registry."192.168.7.45:5000"]
              http = true
            [registry."ghcr.io"]
              mirrors = ["192.168.7.45:5001"]
            [registry."192.168.7.45:5001"]
              http = true
            [registry."nvcr.io"]
              mirrors = ["192.168.7.45:5004"]
            [registry."192.168.7.45:5004"]
              http = true

      - name: Log in to Docker Hub
        uses: docker/login-action@ba754150c9dbbaa912ae0ac3cfba43f84195cef2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: captnspdr/wyoming-glados

      # One image, one tag, both architectures: buildx publishes a manifest
      # list and the client resolves its own platform on pull. The arm64 slice
      # is built from the same Dockerfile as amd64 - there is no ARM-specific
      # variant to maintain.
      #
      # arm64 covers generic Arm servers AND JetPack 7 / Jetson Thor, which
      # aligned with SBSA and a unified CUDA 13 install across Arm targets.
      # That is the CUDA major this stack targets (onnxruntime-gpu 1.29,
      # tensorrt-cu13), so the SBSA aarch64 wheels are the correct build.
      - name: Build and Push dGPU Image (multi-arch)
        id: push-dgpu
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Layer cache. Without it every build reinstalls the venv from
          # scratch - ~3 GB of CUDA/TensorRT/cuDNN wheels - because
          # setup-buildx-action creates a fresh builder per job, so the
          # Dockerfile's pip cache mount starts empty. mode=max caches the
          # builder stage too, which is the expensive one; the default
          # (mode=min) would only cache the final stage and miss it.
          cache-from: type=registry,ref=captnspdr/wyoming-glados:buildcache
          cache-to: type=registry,ref=captnspdr/wyoming-glados:buildcache,mode=max
          # zstd layers: smaller pushes/pulls than gzip and much faster to
          # decompress. The size gain is modest because almost all of this
          # image is CUDA/TensorRT shared libraries - high-entropy, barely
          # compressible. Decompression speed is the real win.
          #
          # Two different numbers get confused here, so both are stated.
          # Measured 2026-08-31 on the dGPU image:
          #
          #   unpacked on disk  8.53 GB   (what `docker images` reports)
          #   image content     3.44 GB   (what is pushed and pulled)
          #
          # An earlier version of this comment called 3.62 GB "uncompressed".
          # It cannot have been: site-packages alone is 4.7 GB unpacked. That
          # figure was the compressed content size, which is the number worth
          # tracking anyway - it is what crosses the network.
          #
          # Built with --build-arg TRT_ARCH=<arch> those become 5.27 GB / 1.90
          # GB, but the published image is deliberately built without it so it
          # can compile engines on any GPU. See docker/Dockerfile.
          #
          # force-compression recompresses inherited layers too, otherwise
          # they would stay gzip and most of the image would not benefit.
          # zstd requires OCI media types. BuildKit's zstd encoder caps out
          # below CLI zstd, so a level above ~9 is just "best available".
          # NOTE: pulling zstd layers needs Docker 23+ / a containerd-era client.
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true

      - name: Extract metadata (tags, labels) for iGPU
        id: meta-igpu
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: captnspdr/wyoming-glados
          flavor: |
            suffix=-igpu,onlatest=true

      # LEGACY: JetPack 6 only. Before JetPack 7 moved Jetson to SBSA, Tegra
      # needed CUDA and TensorRT builds distinct from the SBSA aarch64 wheels
      # that pip ships, which is why this separate image exists. JetPack 7 and
      # newer should pull the multi-arch image above instead.
      #
      # Slated for removal once JetPack 6 is no longer supported. It has never
      # been validated on Jetson hardware - see the note in Dockerfile.igpu.
      - name: Build and Push iGPU (Jetson) Image
        id: push-igpu
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: .
          file: ./docker/Dockerfile.igpu
          push: true
          tags: ${{ steps.meta-igpu.outputs.tags }}
          labels: ${{ steps.meta-igpu.outputs.labels }}
          platforms: linux/arm64
          # Its own cache ref: a different Dockerfile with different
          # layers, which would evict the dGPU cache if they shared one.
          cache-from: type=registry,ref=captnspdr/wyoming-glados:buildcache-igpu
          cache-to: type=registry,ref=captnspdr/wyoming-glados:buildcache-igpu,mode=max
          # zstd layers, same as the dGPU image above.
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true
