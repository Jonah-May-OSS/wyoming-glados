name: Pylint
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dataset.txt too: pylint below lints dataset_tools,
          # which imports scipy. Without it every run fails on E0401.
          python -m pip install -r requirements.txt -r requirements-dev.txt \n            -r requirements-dataset.txt
          # --no-deps: piper-tts requires the CPU-only onnxruntime, which owns
          # the same module as onnxruntime-gpu and would replace it.
          python -m pip install --no-deps -r requirements-piper.txt

      - name: Run pylint
        run: pylint __main__.py download.py server piper_runtime dataset_tools
