---
name: Release

# Creating, publishing and closing the release goes through
# PERSONAL_GITHUB_TOKEN. GITHUB_TOKEN is used by actions/checkout to clone and
# by the version step below to push one commit back to the release branch, so
# it needs contents: write and nothing else.
permissions:
  contents: write

on:
  push:
    branches:
      - release/*

jobs:
  release:
    name: Release
    if: startsWith(github.ref, 'refs/heads/release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: extract_version
        run: |
          VERSION=${GITHUB_REF#refs/heads/release/}
          # This value becomes a git tag, a GitHub milestone lookup and the
          # version setuptools parses out of the VERSION file, so a branch
          # named release/whatever must fail here rather than three steps
          # later. Kept in sync with tests/test_version.py, which checks the
          # pattern against the versions actually released so far.
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'
          if ! printf '%s' "$VERSION" | grep -Eq "$VERSION_PATTERN"; then
            echo "::error::Branch release/$VERSION does not name a release version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # VERSION is what setuptools reads for the package version and what the
      # server advertises in its Wyoming Info message. main carries a
      # placeholder rather than a number anyone has to remember to bump, so
      # the release branch is where the real version gets written. It has to
      # be committed, not just written: the container workflow builds from the
      # published tag, so an uncommitted edit would ship the placeholder.
      #
      # Pushed with GITHUB_TOKEN on purpose. The same push made with
      # PERSONAL_GITHUB_TOKEN would match this workflow's own release/* push
      # trigger and start a second run of it; pushes authenticated with
      # GITHUB_TOKEN do not trigger workflows.
      - name: Write the release version into the package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$(cat VERSION)" = "$VERSION" ]; then
            echo "VERSION already reads $VERSION; nothing to commit."
            exit 0
          fi
          printf '%s\n' "$VERSION" > VERSION
          git commit VERSION -m "chore(release): set the package version to $VERSION"
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      # GitReleaseManager derives the tag from the milestone name, but it does
      # not necessarily tag this branch - it can tag the default branch
      # instead, which would name the commit from *before* the step above and
      # carry the placeholder into the image. Creating the tag here settles
      # which commit it names; the create step below finds it already present
      # and hangs the release off it rather than cutting its own.
      - name: Tag the release at the version commit
        run: |
          existing_obj=$(git ls-remote --tags origin "refs/tags/$VERSION" | cut -f1)
          if [ -n "$existing_obj" ]; then
            # `git tag -a` below makes an annotated tag, and ls-remote reports
            # the tag *object* for one, never the commit it points at - so
            # comparing that value to HEAD can never match, and every re-run
            # of this workflow would die claiming the tag names a different
            # commit. Peel it. A lightweight tag has no ^{} line and its
            # object is the commit already.
            existing=$(git ls-remote --tags origin "refs/tags/$VERSION^{}" | cut -f1)
            [ -n "$existing" ] || existing="$existing_obj"
            if [ "$existing" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $VERSION already names this commit."
              exit 0
            fi
            echo "::error::Tag $VERSION already exists and names $existing, not $(git rev-parse HEAD). Delete the tag and the release before re-running."
            exit 1
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"

      # Assert the artifact rather than trusting the steps that produced it.
      # Everything downstream - the zip, the release, the container image - is
      # built from this tag, so if it does not carry the right version the
      # release is wrong and should fail here rather than ship.
      - name: Verify the tag carries the release version
        run: |
          git fetch --quiet --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          tagged=$(git show "$VERSION:VERSION")
          if [ "$tagged" != "$VERSION" ]; then
            echo "::error::Tag $VERSION carries version '$tagged'"
            exit 1
          fi
          echo "Tag $VERSION carries version $tagged."

      - name: Zip Release
        run: zip -x '*.git*' -r release.zip .

      - name: Install GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@40f115e87851d46e8924ae3aa57f006b0e84268c
        with:
          versionSpec: '0.20.0'

      - name: Create release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/create@40f115e87851d46e8924ae3aa57f006b0e84268c
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ steps.extract_version.outputs.version }}
          name: ${{ steps.extract_version.outputs.version }}
          assets: |
            release.zip

      # The GitHub list-releases API is eventually consistent, so the draft
      # created above is sometimes not visible yet when publish runs, which
      # makes GitReleaseManager crash with a NullReferenceException.
      - name: Wait for draft release to be visible
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          TAG: ${{ steps.extract_version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq '.[].tag_name' | grep -Fxq "$TAG"; then
              echo "Draft release for $TAG is visible to the API."
              exit 0
            fi
            echo "Draft release for $TAG not listed yet (attempt $attempt/30), retrying in 10s..."
            sleep 10
          done
          echo "::error::Draft release for $TAG never appeared in the releases list"
          exit 1

      - name: Publish release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/publish@40f115e87851d46e8924ae3aa57f006b0e84268c
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ steps.extract_version.outputs.version }}

      - name: Close release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/close@40f115e87851d46e8924ae3aa57f006b0e84268c
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ steps.extract_version.outputs.version }}
