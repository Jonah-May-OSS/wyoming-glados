name: Docker Build Check

# The publish workflow only builds on release, so image changes otherwise ship
# unvalidated. This builds the dGPU image (amd64, no push) and runs GPU-free
# smoke tests — venv relocation (imports), models baked in the expected dir,
# and TLS trust — whenever the Dockerfile / entrypoint change. Also dispatchable.
# The voice model is NOT baked into the image: it is fetched at runtime into
# the mounted models dir, so there is nothing to assert about it here.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "docker/Dockerfile"
      - "docker/Dockerfile.igpu"
      - "requirements.txt"
      - "requirements-piper.txt"
      - "docker/run.sh"
      - ".github/workflows/docker-build-check.yml"
  workflow_dispatch: {}

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build dGPU image (amd64) + smoke tests
    runs-on: self-hosted
    steps:
      - name: Check out the repo
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3
        with:
          # Route image pulls through the lab's pull-through registry caches.
          # LAN-only mirrors; buildkit falls back to the upstream registry if
          # a mirror is unreachable (e.g. on a GitHub-hosted runner).
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["192.168.7.45:5000"]
            [registry."192.168.7.45:5000"]
              http = true
            [registry."ghcr.io"]
              mirrors = ["192.168.7.45:5001"]
            [registry."192.168.7.45:5001"]
              http = true
            [registry."nvcr.io"]
              mirrors = ["192.168.7.45:5004"]
            [registry."192.168.7.45:5004"]
              http = true

      # The iGPU image is only ever built at publish time, so until now a
      # syntax error in Dockerfile.igpu surfaced as a failed release. --check
      # parses and lints without building, so this costs seconds and needs no
      # arm64 emulation. It does NOT validate that the image works on Jetson -
      # see the validation note in Dockerfile.igpu.
      - name: Lint iGPU Dockerfile (parse only, no build)
        run: docker buildx build --check --platform linux/arm64 -f docker/Dockerfile.igpu .

      - name: Build dGPU image (amd64, load locally, no push)
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: wyoming-glados:build-check
          platforms: linux/amd64
          # Read-only: this job has no registry login, so it seeds from
          # the cache the release build publishes but cannot write back.
          # requirements.txt changes rarely, so the expensive venv layer
          # is usually a hit even on a cache from the last release.
          cache-from: type=registry,ref=captnspdr/wyoming-glados:buildcache

      - name: Import smoke test (venv relocated onto the slim runtime, no GPU)
        # onnxruntime and tensorrt import cleanly without a GPU and prove the
        # venv relocated. The TensorRT execution provider must be listed as
        # available: it being absent is how a CPU-only onnxruntime silently
        # replaces the GPU build.
        #
        # server.handler is imported too, so a runtime dependency missing from
        # requirements.txt fails here rather than when the container starts.
        run: |
          docker run --rm \
            --entrypoint /usr/src/wyoming-glados/venv/bin/python \
            -w /usr/src/wyoming-glados \
            wyoming-glados:build-check \
            -c "import importlib.util, onnxruntime, tensorrt; \
                import server.handler, piper_runtime; \
                providers = onnxruntime.get_available_providers(); \
                assert 'TensorrtExecutionProvider' in providers, providers; \
                print('onnxruntime', onnxruntime.__version__); \
                print('tensorrt', tensorrt.__version__); \
                print('providers', providers)"

      # onnxruntime-gpu and the CPU-only onnxruntime package own the same
      # module, so if both land the CPU build wins and CUDA/TensorRT vanish
      # with no error - just ~5x less throughput. piper-tts depends on the CPU
      # one, which is why it installs with --no-deps; this asserts that held.
      - name: CPU onnxruntime must not shadow the GPU build
        run: |
          docker run --rm --entrypoint sh wyoming-glados:build-check -c '
            if /usr/src/wyoming-glados/venv/bin/pip show onnxruntime >/dev/null 2>&1; then
              echo "FAIL: CPU onnxruntime is installed and shadows onnxruntime-gpu"
              exit 1
            fi
            echo "CPU onnxruntime absent OK"'

      # piper bundles espeak-ng: espeakbridge.so links it statically and ships
      # its own espeak-ng-data, so there is no system package to assert on.
      # What matters is that phonemization actually runs - without it the
      # server starts and then fails every synthesis request.
      - name: Phonemizer produces phonemes
        run: |
          docker run --rm \
            --entrypoint /usr/src/wyoming-glados/venv/bin/python \
            wyoming-glados:build-check \
            -c "from piper.phonemize_espeak import EspeakPhonemizer; \
                out = EspeakPhonemizer().phonemize('en-us', 'Hello there.'); \
                assert out and out[0], out; \
                print('phonemes', out[0][:6])"

      - name: TLS trust smoke test (catches a missing CA bundle, no GPU needed)
        run: |
          docker run --rm \
            --entrypoint /usr/src/wyoming-glados/venv/bin/python \
            wyoming-glados:build-check \
            -c "import urllib.request, urllib.error
          try:
              urllib.request.urlopen('https://github.com', timeout=20)
          except urllib.error.HTTPError:
              pass  # any HTTP status means the TLS handshake + CA verify worked
          print('TLS trust OK')"

      - name: Report image size
        run: |
          docker images wyoming-glados:build-check --format '{{.Size}}'
# (re-trigger)
