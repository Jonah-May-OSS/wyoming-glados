---
name: ty
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # requirements-dataset.txt too: the include below covers
          # dataset_tools, which imports scipy. Without it every run fails on
          # unresolved-import.
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-dataset.txt
          # --no-deps: piper-tts requires the CPU-only onnxruntime, which owns
          # the same module as onnxruntime-gpu and would replace it. It is
          # installed at all because piper_runtime.runner imports
          # piper.phonemize_espeak; without it that import is unresolvable and
          # ty fails on a module that is genuinely present at runtime.
          .venv/bin/python -m pip install --no-deps -r requirements-piper.txt

      - name: Run ty
        run: .venv/bin/ty check
