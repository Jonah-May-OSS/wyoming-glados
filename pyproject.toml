[build-system]
# >=77 for PEP 639: the SPDX `license` string and `license-files` below are
# rejected by older setuptools, which would only surface for someone with a
# pinned build environment since isolated builds fetch the latest.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-glados"
version = "0.1.0"
description = "Wyoming protocol server for GLaDOS TTS"
requires-python = ">=3.11"
# GPL-3.0-or-later, not MIT: piper_runtime imports piper.phonemize_espeak at
# request time and the published image ships piper-tts, which is
# GPL-3.0-or-later. See NOTICE.md.
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md", "NOTICE.md"]

# Explicit, because flat-layout auto-discovery fails on this repo: it sees
# data/, docker/ and tests/ as top-level packages and refuses to guess. Only
# the runtime packages ship; dataset_tools is build-time tooling and is
# excluded from the image by .dockerignore too.
[tool.setuptools]
packages = ["server", "piper_runtime"]

[tool.ruff]
line-length = 88
target-version = "py311"
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__main__.py" = ["E402"]  # Module level imports not at top (needed for warning suppression)

[tool.ruff.lint.isort]
# Pin first-party packages explicitly so every linter agrees on import order
# regardless of what happens to be present in the checkout.
known-first-party = ["dataset_tools", "piper_runtime", "server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "docker/*",
    "htmlcov/*",
]

[tool.coverage.report]
omit = [
    "tests/*",
]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = [
    "__main__.py",
    "download.py",
    "server",
    "piper_runtime",
    "dataset_tools",
]
exclude = [
    "tests",
    "docker",
    "htmlcov",
    ".venv",
    "**/.git",
    "**/.hg",
    "**/.svn",
    "**/.*",
    "**/node_modules",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.pytest_cache",
    "**/.ruff_cache",
    # Training-only helpers. They import onnx and piper.train, which live in
    # the WSL training venv and are deliberately absent from the runtime
    # requirements, so type checking them in CI only produces import noise.
    "dataset_tools/bake_scales.py",
    "dataset_tools/export_onnx.py",
]
reportMissingModuleSource = "none"
reportMissingTypeStubs = "none"
reportDeprecated = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportUnnecessaryCast = "none"
strict = [
    "download.py",
    "server",
]
executionEnvironments = [
    { root = ".", extraPaths = ["."] },
]
