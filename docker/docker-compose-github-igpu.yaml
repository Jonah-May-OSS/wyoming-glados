version: "3"
services:
  wyoming-glados:
    build:
      # The Dockerfile COPYs the repo (source, requirements, run.sh),
      # so the context is the repo root, not docker/.
      context: ..
      dockerfile: docker/Dockerfile.igpu
    image: wyoming-glados
    container_name: wyoming-glados
    ports:
      - 10201:10201
    volumes:
      - ./models:/usr/src/models:rw
    environment:
      - STREAMING=true
      - DEBUG=false
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
