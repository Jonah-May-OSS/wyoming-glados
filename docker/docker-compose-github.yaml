version: "3"
services:
  wyoming-glados:
    build:
      # The Dockerfile COPYs the repo (source, requirements, run.sh),
      # so the context is the repo root, not docker/.
      context: ..
      dockerfile: docker/Dockerfile
    image: wyoming-glados
    container_name: wyoming-glados
    ports:
      - 10201:10201
    volumes:
      - ./models:/usr/src/models:rw
    environment:
      - STREAMING=true
      - DEBUG=false
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
